<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omni Agent Trace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">OMNI AGENT / LOCAL OBSERVABILITY</p>
        <h1>Trace Studio</h1>
      </div>
      <div id="agent" class="badge">Loading…</div>
    </header>
    <main>
      <aside>
        <section>
          <h2>Sessions</h2>
          <div id="sessions" class="list"></div>
        </section>
        <section>
          <h2>Runs</h2>
          <div id="runs" class="list"></div>
        </section>
      </aside>
      <article>
        <nav>
          <button data-view="replay" class="active">Replay</button>
          <button data-view="requests">Model requests</button>
          <button data-view="waterfall">Waterfall</button>
          <button data-view="raw">Raw events</button>
        </nav>
        <div id="summary" class="summary">Select a Session and Run.</div>
        <div id="capture-warning" class="capture-warning" role="status" hidden></div>
        <div id="content"></div>
      </article>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
