version = "1.0"

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 60

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 4096

[environment.healthcheck]
command = "curl -fsS http://127.0.0.1:18080/health || (nohup python3 /mock/model-server.py >/mock/server.log 2>&1 </dev/null & sleep 1; curl -fsS http://127.0.0.1:18080/health)"
interval_sec = 2
